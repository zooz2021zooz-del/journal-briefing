{% extends "base.html" %}
{% block content %}
<div class="hero">
  <div class="hero-icon">🔬</div>
  <h2 class="hero-title">우리 연구실에 딱 맞는 논문, 자동으로 찾아드려요</h2>
  <p class="hero-subtitle">키워드와 연구실 소개만 입력하면, OpenAlex와 Nature/Science 최신호를 실시간으로 훑어서 관련도 높은 순으로 정리해드려요.</p>
</div>

<form method="post" action="{{ url_for('search') }}" id="search-form" class="card form-card">
  <div class="form-section">
    <span class="step-num">1</span>
    <div class="step-body">
      <label for="lab_name">연구실 이름</label>
      <input type="text" id="lab_name" name="lab_name" placeholder="예: 성균관대 OOO 교수 연구실">
    </div>
  </div>

  <div class="form-section">
    <span class="step-num">2</span>
    <div class="step-body">
      <label for="keywords">검색 키워드 (한 줄에 하나씩, 최대 {{ max_keywords }}개)</label>
      <textarea id="keywords" name="keywords" placeholder="예:&#10;triboelectric nanogenerator&#10;wearable biosignal sensor" required></textarea>
      <p class="hint">💡 영어 키워드를 쓰면 OpenAlex 검색이 더 잘 돼요.</p>
    </div>
  </div>

  <div class="form-section">
    <span class="step-num">3</span>
    <div class="step-body">
      <label for="lab_profile">연구실 소개 (관련성 판단에 사용돼요)</label>
      <textarea id="lab_profile" name="lab_profile" placeholder="연구실의 주요 연구 분야, 관심사를 자유롭게 설명해주세요." required></textarea>
    </div>
  </div>

  <div class="form-section">
    <span class="step-num">4</span>
    <div class="step-body">
      <label style="margin-top:0;">검색 옵션</label>
      <div class="row">
        <div>
          <select id="days_back" name="days_back">
            <option value="3">최근 3일</option>
            <option value="7" selected>최근 7일</option>
            <option value="14">최근 14일</option>
            <option value="30">최근 30일</option>
          </select>
        </div>
        <div>
          <select id="min_score" name="min_score">
            <option value="50">관련도 50점 이상</option>
            <option value="60">관련도 60점 이상</option>
            <option value="70" selected>관련도 70점 이상</option>
            <option value="80">관련도 80점 이상</option>
          </select>
        </div>
      </div>

      <label class="toggle-chip">
        <input type="checkbox" id="include_rss" name="include_rss" checked>
        <span>⭐ Nature/Science 주요 저널 RSS도 함께 검색 (권장)</span>
      </label>
    </div>
  </div>

  <button type="submit" id="submit-btn">🔍 검색 시작</button>
  <p class="hint" id="loading-hint" style="display:none; text-align:center;">검색 중이에요. 논문 수에 따라 1~2분 정도 걸릴 수 있어요...</p>
</form>

<script>
document.getElementById('search-form').addEventListener('submit', function () {
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('submit-btn').innerText = '검색 중...';
  document.getElementById('loading-hint').style.display = 'block';
});
</script>
{% endblock %}
