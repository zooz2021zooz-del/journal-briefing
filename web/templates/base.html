<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}랩실 논문 브리핑{% endblock %}</title>
<style>
  :root {
    --bg: #f5f6fb;
    --card: #ffffff;
    --text: #1a1c23;
    --muted: #6b7280;
    --border: #e6e8f0;
    --accent: #5b5fef;
    --accent-dark: #4649c9;
    --accent-soft: #eef0fe;
    --top: #b8860b;
    --top-bg: #fdf8ec;
    --danger: #d64545;
    --danger-bg: #fdecec;
    --shadow: 0 1px 2px rgba(20, 20, 43, 0.04), 0 4px 14px rgba(20, 20, 43, 0.06);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 72px;
  }
  h1 { font-size: 21px; margin: 0; letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
  .subtitle a { color: var(--accent); text-decoration: none; font-weight: 500; }
  .subtitle a:hover { text-decoration: underline; }
  label { display: block; font-weight: 600; font-size: 13.5px; margin: 18px 0 6px; color: var(--text); }
  input[type=text], input[type=password], input[type=number], textarea, select {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: inherit;
    background: var(--card);
    color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea { min-height: 100px; resize: vertical; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .row { display: flex; gap: 16px; }
  .row > div { flex: 1; }
  button, .btn {
    display: inline-block;
    background: var(--accent);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    margin-top: 20px;
    transition: background 0.15s, transform 0.05s, box-shadow 0.15s;
    box-shadow: 0 1px 2px rgba(20, 20, 43, 0.08);
  }
  button:hover, .btn:hover { background: var(--accent-dark); }
  button:active, .btn:active { transform: translateY(1px); }
  .btn-secondary {
    background: var(--card);
    color: var(--accent);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  .btn-secondary:hover { background: var(--accent-soft); border-color: var(--accent); }
  .btn-danger {
    background: var(--danger-bg);
    color: var(--danger);
    border: 1px solid #f3caca;
    box-shadow: none;
  }
  .btn-danger:hover { background: #fbdada; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.15s;
  }
  .card:hover { box-shadow: 0 2px 4px rgba(20, 20, 43, 0.06), 0 8px 20px rgba(20, 20, 43, 0.08); }
  .card.top { border-left-color: var(--top); background: var(--top-bg); }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #d4a017, var(--top));
    color: white;
    font-size: 10.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    margin-right: 6px;
    letter-spacing: 0.02em;
  }
  .meta { font-size: 12px; color: var(--muted); margin: 0 0 7px; }
  .card h3 { margin: 4px 0; font-size: 15.5px; line-height: 1.4; }
  .card h3 a { color: var(--text); text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .authors { font-size: 12.5px; color: #6b7280; margin: 4px 0; }
  .summary {
    font-size: 13.5px;
    background: rgba(91, 95, 239, 0.05);
    padding: 11px 12px;
    border-radius: 8px;
    margin-top: 8px;
    color: var(--text);
  }
  .card-actions { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
  .card-actions a, .card-actions button {
    margin-top: 0;
    padding: 7px 13px;
    font-size: 12.5px;
  }
  .error { color: #a83232; background: var(--danger-bg); padding: 10px 14px; border-radius: 8px; font-size: 14px; }
  .warning { color: #8a6d3b; background: #fcf8e3; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 8px; }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .top-bar a { color: var(--muted); font-size: 13px; text-decoration: none; font-weight: 500; }
  .top-bar a:hover { color: var(--accent); }
  .hero { text-align: center; padding: 12px 8px 28px; }
  .hero-icon {
    font-size: 34px;
    width: 64px;
    height: 64px;
    margin: 0 auto 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--accent-soft);
    border-radius: 18px;
  }
  .hero-title { font-size: 20px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .hero-subtitle { color: var(--muted); font-size: 14px; max-width: 440px; margin: 0 auto; }
  .form-card { border-left: 1px solid var(--border); }
  .form-section {
    display: flex;
    gap: 14px;
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
  }
  .form-section:first-child { padding-top: 0; }
  .form-section:last-of-type { border-bottom: none; padding-bottom: 4px; }
  .step-num {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 2px;
  }
  .step-body { flex: 1; min-width: 0; }
  .step-body label:first-child { margin-top: 0; }
  .toggle-chip {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 14px;
    padding: 10px 14px;
    background: var(--accent-soft);
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .toggle-chip input { width: auto; margin: 0; }
  #submit-btn { width: 100%; text-align: center; font-size: 16px; padding: 14px; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151b;
      --card: #1d1f28;
      --text: #ececf1;
      --muted: #9aa1ac;
      --border: #2c2f3a;
      --accent-soft: #24254a;
      --top-bg: #2a2416;
      --danger-bg: #3a2020;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 4px 14px rgba(0, 0, 0, 0.25);
    }
  }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 43, 0.45);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--card);
    border-radius: 14px;
    padding: 24px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  .modal-box h3 { margin: 0 0 4px; font-size: 17px; }
  .modal-box .card-actions { margin-top: 16px; }
  .modal-status { font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-bar">
    <h1>📚 랩실 논문 브리핑</h1>
    {% if session.get('authed') %}
    <span>
      <a href="{{ url_for('mypage') }}">마이페이지</a>
      &nbsp;·&nbsp;
      <a href="{{ url_for('logout') }}">로그아웃</a>
    </span>
    {% endif %}
  </div>
  {% block content %}{% endblock %}
</div>

<div class="modal-overlay" id="email-modal">
  <div class="modal-box">
    <h3>📧 이메일로 보내기</h3>
    <p class="hint" id="email-modal-count">0건을 보냅니다.</p>
    <label for="email-recipient">받는 사람 이메일</label>
    <input type="text" id="email-recipient" placeholder="example@gmail.com" autocomplete="email">
    <div class="card-actions">
      <button type="button" class="btn" id="email-send-btn">보내기</button>
      <button type="button" class="btn btn-secondary" id="email-cancel-btn">취소</button>
    </div>
    <p class="modal-status" id="email-status"></p>
  </div>
</div>

<script>
var _emailPapers = [];
var _emailSubject = '논문 공유';

function openEmailModal(papers, subject) {
  _emailPapers = papers;
  _emailSubject = subject || '논문 공유';
  document.getElementById('email-modal-count').innerText = papers.length + '건을 보냅니다.';
  document.getElementById('email-status').innerText = '';
  document.getElementById('email-recipient').value = localStorage.getItem('lastEmailRecipient') || '';
  document.getElementById('email-modal').classList.add('open');
}

function closeEmailModal() {
  document.getElementById('email-modal').classList.remove('open');
}

document.getElementById('email-cancel-btn').addEventListener('click', closeEmailModal);
document.getElementById('email-modal').addEventListener('click', function (e) {
  if (e.target === this) closeEmailModal();
});

document.getElementById('email-send-btn').addEventListener('click', function () {
  var recipient = document.getElementById('email-recipient').value.trim();
  var statusEl = document.getElementById('email-status');
  if (!recipient || recipient.indexOf('@') === -1) {
    statusEl.innerText = '받는 사람 이메일을 정확히 입력해주세요.';
    return;
  }
  var btn = document.getElementById('email-send-btn');
  btn.disabled = true;
  btn.innerText = '보내는 중...';
  statusEl.innerText = '';

  fetch('/send-email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ recipient: recipient, subject: _emailSubject, papers: _emailPapers })
  })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      btn.disabled = false;
      btn.innerText = '보내기';
      if (data.success) {
        localStorage.setItem('lastEmailRecipient', recipient);
        statusEl.style.color = '#2a9d5c';
        statusEl.innerText = '✅ 발송 완료!';
        setTimeout(closeEmailModal, 1200);
      } else {
        statusEl.style.color = '#c0392b';
        statusEl.innerText = '❌ 실패: ' + (data.error || '알 수 없는 오류');
      }
    })
    .catch(function () {
      btn.disabled = false;
      btn.innerText = '보내기';
      statusEl.style.color = '#c0392b';
      statusEl.innerText = '❌ 네트워크 오류가 발생했어요.';
    });
});
</script>
</body>
</html>
